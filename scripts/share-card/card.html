<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IT;src:url(intertight.woff2)}@font-face{font-family:I;src:url(inter.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0b1220;font-family:I,sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:url({{BG}}) center/cover;filter:saturate(.7)}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,15,30,.96) 0%,rgba(9,15,30,.9) 52%,rgba(9,15,30,.55) 100%)}
.wrap{position:absolute;left:72px;top:58px;right:72px;bottom:58px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-family:IT;font-weight:800;font-size:28px;letter-spacing:-.5px}
.brand img{height:40px}
.eye{margin-top:auto;color:#f2b632;font-weight:700;font-size:22px;letter-spacing:3px;text-transform:uppercase}
h1{font-family:IT;font-weight:800;font-size:76px;line-height:1.0;letter-spacing:-2.5px;margin-top:16px;max-width:820px}
.sub{margin-top:22px;font-size:27px;color:#d5dbe7;font-weight:500}
.play{position:absolute;right:84px;top:50%;transform:translateY(-36%);width:150px;height:150px;border-radius:50%;background:#f2b632;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.play:after{content:"";margin-left:12px;border-left:46px solid #0b1220;border-top:29px solid transparent;border-bottom:29px solid transparent}
.lbl{position:absolute;right:66px;top:calc(50% + 112px);width:186px;text-align:center;font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:#fff}
</style></head><body><div class="bg"></div><div class="sh"></div>
<div class="wrap"><div class="brand"><img src="stm-mark.png">Supreme Team Media</div>
<div class="eye">{{EYEBROW}}</div>
<h1>{{HEADLINE}}</h1>
<div class="sub">{{SUB}}</div></div>
<div class="play"></div><div class="lbl">Watch</div>
</body></html>

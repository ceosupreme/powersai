name: HQ team access verification
on:
  push:
    branches: ['fix/team-access-2026-11-03']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hq-team-access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Package source for review
        run: |
          mkdir -p /tmp/hq-review
          git archive --format=tar HEAD | gzip > /tmp/hq-review/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hq-team-access-source
          path: /tmp/hq-review/source.tar.gz
          retention-days: 2
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - name: Run local-only regression suites
        run: |
          node scripts/security/check-edge-guards.mjs
          for test in scripts/security/*.test.mjs scripts/frontend/*.test.mjs scripts/tests/*.test.mjs scripts/hq/*.test.mjs; do
            node "$test"
          done
      - run: npm run build

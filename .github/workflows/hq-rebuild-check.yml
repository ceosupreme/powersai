name: HQ rebuild checks

# Deliberately do not run on each push or draft PR synchronization.
# The HQ rebuild is intentionally being built in increments, and full checks
# occur when its draft PR is explicitly marked ready for review.
on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: npm run build
